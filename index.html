<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Raksha Bandhan — Virtual Rakhi</title>
<meta name="description" content="Open your front camera, show your right hand, and receive a virtual rakhi on your wrist.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧵</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ============ START SCREEN ============ -->
  <section id="start-screen" class="screen">
    <div class="start-card">
      <div class="start-emoji" aria-hidden="true">🧵</div>
      <h1>Raksha Bandhan</h1>
      <p>Tap below to open your front camera and receive a virtual rakhi on your wrist.</p>
      <button id="open-camera-link" class="link-button" type="button">
        Open Camera
      </button>
      <p class="hint">Your camera stream stays on your device — nothing is recorded or uploaded.</p>
    </div>
  </section>

  <!-- ============ CAMERA SCREEN ============ -->
  <section id="camera-screen" class="screen hidden">

    <!-- Top bar: title + flash toggle, pinned to the very top of the viewport -->
    <header class="top-bar">
      <span class="app-title">Raksha Bandhan</span>
      <button id="flash-toggle" class="flash-btn" type="button" aria-pressed="false" aria-label="Toggle flash">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path fill="currentColor" d="M11 21l1-7H7l6-11h1l-1 7h5l-7 11z"/>
        </svg>
      </button>
    </header>

    <!-- Simulated front-flash glow, lives behind the top bar -->
    <div id="flash-glow" class="flash-glow" aria-hidden="true"></div>

    <div class="video-stage" id="video-stage">
      <video id="camera-feed" autoplay playsinline muted></video>

      <!-- Mirrored to match the video (see CSS): the rakhi is positioned using
           raw, un-mirrored landmark coordinates and this wrapper's flip lines
           it up with what's on screen, exactly like the video itself. The
           actual rakhi markup (assets/rakhi.svg) is injected live into
           #rakhi-mount so its built-in tie-on animation really plays,
           instead of drawing a frozen frame to a canvas. -->
      <div id="overlay-mirror" class="overlay-mirror">
        <div id="rakhi-mount" class="rakhi-mount"></div>
      </div>

      <!-- Instructional banner that slides down from the top, then slides back up -->
      <div id="instruction-banner" class="instruction-banner">
        <span>Show your right hand in front of the camera</span>
      </div>

      <div id="loading-indicator" class="loading-indicator">
        <div class="spinner"></div>
        <span id="loading-text">Starting camera…</span>
      </div>

      <div id="error-box" class="error-box hidden">
        <p id="error-text"></p>
        <button id="error-retry" class="link-button small" type="button">Try again</button>
      </div>
    </div>
  </section>

  <script type="module" src="js/app.js"></script>
</body>
</html>
