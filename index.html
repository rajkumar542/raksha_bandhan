<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Raksha Bandhan — Virtual Rakhi</title>
<meta name="description" content="Open your back camera, show your right hand, and receive a virtual rakhi on your wrist.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧵</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ============ START SCREEN ============ -->
  <!-- Deliberately just a plain full-screen tap target: the browser needs a
       user gesture before it will grant camera access, so this can't be
       skipped entirely, but there's no card, title, or copy — tapping
       anywhere goes straight into opening the camera. -->
  <button id="start-screen" class="screen start-screen" type="button" aria-label="Tap to open camera">
    <svg viewBox="0 0 24 24" width="40" height="40" aria-hidden="true">
      <path fill="currentColor" d="M9 3l-1.83 2H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.17L15 3H9zm3 15a5 5 0 1 1 0-10 5 5 0 0 1 0 10z"/>
    </svg>
    <span>Tap to open camera</span>
  </button>

  <!-- ============ CAMERA SCREEN ============ -->
  <section id="camera-screen" class="screen hidden">

    <!-- Top bar: title + flash toggle, pinned to the very top of the viewport -->
    <header class="top-bar">
      <span class="app-title">Raksha Bandhan</span>
      <button id="flash-toggle" class="flash-btn" type="button" aria-pressed="false" aria-label="Toggle flash">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path fill="currentColor" d="M11 21l1-7H7l6-11h1l-1 7h5l-7 11z"/>
        </svg>
      </button>
    </header>

    <!-- Simulated front-flash glow, lives behind the top bar -->
    <div id="flash-glow" class="flash-glow" aria-hidden="true"></div>

    <div class="video-stage" id="video-stage">
      <video id="camera-feed" autoplay playsinline muted></video>

      <!-- Only mirrored (see CSS) if JS ends up falling back to a front
           camera; the rakhi is positioned using raw landmark coordinates
           and this wrapper flips alongside the video so the two always
           line up. The actual rakhi markup (assets/rakhi.svg) is injected
           live into #rakhi-mount so its built-in tie-on animation really
           plays, instead of drawing a frozen frame to a canvas. -->
      <div id="overlay-mirror" class="overlay-mirror">
        <div id="rakhi-mount" class="rakhi-mount"></div>
      </div>

      <!-- Slides down from the top with the initial instruction, then slides
           back up once a hand is confirmed. -->
      <div id="instruction-banner" class="instruction-banner">
        <span>Show your right hand in front of the camera</span>
      </div>

      <!-- Closing message once the rakhi finishes its one-shot tie-on-and-fade
           sequence: plain floating bold text, centered on screen, no card or
           background — fades and drifts gently into place. -->
      <div id="final-message" class="final-message" aria-live="polite">
        <span>Happy Raksha Bandhan! 🎉</span>
      </div>

      <div id="loading-indicator" class="loading-indicator">
        <div class="spinner"></div>
        <span id="loading-text">Starting camera…</span>
      </div>

      <div id="error-box" class="error-box hidden">
        <p id="error-text"></p>
        <!-- Raw error name/message, so a failure is diagnosable from a
             screenshot without needing to open devtools. -->
        <p id="error-detail" class="error-detail hidden"></p>
        <button id="error-retry" class="link-button small" type="button">Try again</button>
      </div>
    </div>
  </section>

  <script type="module" src="js/app.js"></script>
</body>
</html>
